<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="index,follow">
  <!-- Address of the feedback service (services/feedback in the app repo), e.g.
       https://feedback.example.com/v1/feedback. Empty: the form opens an email instead. -->
  <meta name="feedback-endpoint" content="">
  <title>Feedback — Deep Focus</title>
  <meta name="theme-color" content="#141210">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="page.css">
  <script src="analytics.js?v=1" defer></script>
  <script src="feedback.js?v=1" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header><a class="brand" href="index.html"><img src="icon.png" width="36" height="36" alt="">Deep Focus</a></header>
  <main id="main">
    <article class="card">
      <div class="titlebar" aria-hidden="true"><i></i><i></i><i></i></div>
      <h1>Send feedback</h1>
      <p class="lead">An idea, something that got in your way, something you liked. A few lines is plenty.</p>
      <p class="notice" id="status" role="status" hidden></p>
      <form id="feedback" class="form" method="post" action="mailto:hello@getdeepfocus.com" novalidate>
        <label for="message">Your feedback</label>
        <textarea id="message" name="message" rows="7" maxlength="4000" required></textarea>
        <label for="email">Your email <span class="hint">(optional, only if you’d like a reply)</span></label>
        <input id="email" name="email" type="email" maxlength="200" autocomplete="email">
        <div class="include" id="include" hidden>
          <input id="include-versions" type="checkbox" checked>
          <label for="include-versions">Include <span id="versions"></span></label>
        </div>
        <div class="trap" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
        <input type="hidden" name="source" value="site">
        <input type="hidden" name="app_version" value="">
        <input type="hidden" name="macos" value="">
        <div class="actions"><button class="button" type="submit" id="send">Send feedback</button></div>
        <p class="hint" id="how">Please leave out journal contents, passwords and card details. We never need them.</p>
      </form>
      <noscript><p>You can also email your feedback to <a href="mailto:hello@getdeepfocus.com">hello@getdeepfocus.com</a>.</p></noscript>
    </article>
  </main>
  <footer>
    <a href="index.html">Home</a>
    <a href="support.html">Support</a>
    <a href="feedback.html" aria-current="page">Feedback</a>
    <a href="subscribe.html">Subscribe</a>
    <a href="manage.html">Manage subscription</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </footer>
</body>
</html>
