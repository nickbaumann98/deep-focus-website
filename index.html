<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Deep Focus</title>
  <meta name="description" content="Press one shortcut and everything on your Mac goes dark except the window you're working in.">
  <meta name="theme-color" content="#141210">
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2"><link rel="stylesheet" href="desktop/desktop.css">
</head>
<body>
  <!-- Interactive, fictional desktop demo. -->
  <div id="desktop" aria-label="Interactive demo desktop">
    <div id="menubar">
      <div id="menu-left"></div>
      <div class="status">
        <svg class="s-bat" viewBox="0 0 27 13"><rect x=".5" y=".5" width="22.5" height="12" rx="3.6" fill="none" stroke="currentColor" stroke-opacity=".45"/><rect x="2" y="2" width="4" height="9" rx="2.2" fill="currentColor"/><path d="M24.5 4.5v4c.9-.3 1.5-1.1 1.5-2s-.6-1.7-1.5-2Z" fill="currentColor" fill-opacity=".5"/></svg>
        <svg class="s-wifi" viewBox="0 0 18 13" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M1.5 4.400a10.8 10.8 0 0 1 15 0"/><path d="M4.3 7.200a6.8 6.8 0 0 1 9.4 0"/><path d="M7 10a2.9 2.9 0 0 1 4 0"/></svg>
        <svg class="s-search" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6.3" cy="6.3" r="4.8"/><path d="m10 10 4 4"/></svg>
        <svg class="s-cc" viewBox="0 0 17 13"><rect x=".6" y=".6" width="15.8" height="5.3" rx="2.65" fill="none" stroke="currentColor" stroke-width="1.1"/><circle cx="13.7" cy="3.25" r="1.5" fill="currentColor"/><rect x=".6" y="7.1" width="15.8" height="5.3" rx="2.65" fill="currentColor"/><circle cx="3.3" cy="9.75" r="1.5" fill="#000" fill-opacity=".55"/></svg>
        <span id="clock"></span>
      </div>
    </div>
    <div id="files"></div>
    <div id="windows"></div>
    <div id="toasts"></div>
    <div id="dock"></div><div id="spotlight"></div><div id="center"></div><div id="dim"></div>
  </div>

  <!-- The one calm window. -->
  <div id="backing" aria-hidden="true"></div>
  <main id="hero">
    <div class="titlebar" aria-hidden="true"><i></i><i></i><i></i><span>Deep Focus</span></div>
    <div class="hero-body">
      <img src="icon.png" width="84" height="84" alt="">
      <h1>Deep Focus</h1>
      <button id="keys" type="button" aria-label="Enter Deep Focus mode">
        <kbd>⌘</kbd><kbd>⇧</kbd><kbd>F</kbd>
      </button>
      <p id="line" aria-live="polite"></p>
      <a id="download" href="#"><svg viewBox="0 0 20 20" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v10M5.5 8.5 10 13l4.5-4.5M4 17h12"/></svg>Download for Mac</a>
    </div>
  </main>

  <!-- The walls. Solid panels that slide in, each leading with a soft edge. -->
  <div id="walls" aria-hidden="true">
    <div class="wall" data-side="left"><div class="edge"></div></div>
    <div class="wall" data-side="right"><div class="edge"></div></div>
    <div class="wall" data-side="top"><div class="edge"></div></div>
    <div class="wall" data-side="bottom"><div class="edge"></div></div>
  </div>

  <button id="pill" type="button" aria-label="Press and hold for five seconds to leave Deep Focus mode" tabindex="-1">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
      <circle class="track" cx="11" cy="11" r="9"/>
      <circle id="ring" cx="11" cy="11" r="9" transform="rotate(-90 11 11)"/>
    </svg>
    <span>Hold 5 seconds to exit</span>
  </button>

  <script type="module" src="main.js"></script>
</body>
</html>
